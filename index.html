  <style>
    :root {
      --app-h: 100vh;
      --bg: #050505; --card: #111113; --line: #232326; --crimson: #e04f4f; --gold: #cfa972;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --top-h: calc(44px + var(--sat));
    }
    html.is-standalone { --top-h: max(var(--sat), 14px); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: text; }
    html, body { margin: 0; padding: 0; height: var(--app-h); background: var(--bg); color: #f4f4f5; font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; overflow: hidden; }
    .phone-frame { height: 100%; }
    @media (min-width: 640px) { .phone-frame { height: min(844px, 95dvh); } }
    html.is-standalone #mockStatusBar { display: none !important; }
    html.is-standalone #homeBarWrap { display: none !important; }
    #mockStatusBar { height: var(--top-h); padding-top: calc(8px + var(--sat)); }
    #bannerWrap { top: calc(var(--top-h) + 6px); }
    .screen-layer { position: absolute; left: 0; right: 0; top: var(--top-h); bottom: 0; }
    .safe-pb { padding-bottom: calc(var(--sab) + 18px); }
    .no-sb { scrollbar-width: none; -ms-overflow-style: none; }
    .no-sb::-webkit-scrollbar { display: none; }

    .glass-app:active { transform: scale(.91); }
    .card { background: linear-gradient(160deg, #151519, #0e0e11); border: 1px solid var(--line); }
    .sync-card { background: linear-gradient(155deg, #241d16, #14110e); border: 1px solid rgba(207,169,114,.42); color: #f8f1e6; }
    .gold-card { background: radial-gradient(circle at 86% 18%, rgba(207,169,114,.22), transparent 48%), linear-gradient(135deg, #221d17 0%, #0d0d10 54%, #1a1612 100%); border: 1px solid rgba(207,169,114,.35); }
    .app-layer { position: absolute; left: 0; right: 0; top: var(--top-h); bottom: 0; background: var(--bg); z-index: 40; display: flex; flex-direction: column; transform: translateX(100%); opacity: .35; pointer-events: none; transition: transform .3s cubic-bezier(.22,1,.36,1), opacity .24s; }
    .app-layer.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
    .pages-track { display: flex; width: 100%; height: 100%; transition: transform .36s cubic-bezier(.22,1,.36,1); will-change: transform; }
    .page-slide { width: 100%; flex-shrink: 0; padding: 0 20px; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; }
    .page-slide::-webkit-scrollbar { display: none; }
    .page-dot { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.22); transition: all .24s; }
    .page-dot.active { width: 18px; background: var(--gold); box-shadow: 0 0 8px rgba(207,169,114,.55); }
    #iconPreviewImg { -webkit-touch-callout: default; user-select: auto; }
    .banner { transform: translateY(-150%); opacity: 0; transition: transform .4s cubic-bezier(.22,1,.36,1), opacity .28s; }
    .banner.show { transform: translateY(0); opacity: 1; }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; text-shadow: 0 0 14px rgba(224,79,79,.45); } }
    .breathe-red { color: var(--crimson); animation: breathe 2.6s ease-in-out infinite; }

    @keyframes wave { 0%,100%{transform:scaleY(.38);opacity:.55} 50%{transform:scaleY(1.28);opacity:1} }
    .v-play .vb { animation: wave .68s ease-in-out infinite; }
    .v-play .vb:nth-child(2){animation-delay:.12s} .v-play .vb:nth-child(3){animation-delay:.24s} .v-play .vb:nth-child(4){animation-delay:.36s}
    @keyframes pulseRing { 0%{transform:scale(.85);opacity:.75} 100%{transform:scale(1.6);opacity:0} }
    .pulse-ring { animation: pulseRing 2.2s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes buzz { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2.5px)} 75%{transform:translateX(2.5px)} }
    .buzz { animation: buzz .18s linear infinite; }

    const IS_STANDALONE = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (IS_STANDALONE) document.documentElement.classList.add('is-standalone');
    function syncViewportHeight() {
      const h = IS_STANDALONE ? Math.max(window.innerHeight, window.screen.height) : window.innerHeight;
      document.documentElement.style.setProperty('--app-h', h + 'px');
    }
    syncViewportHeight();
    window.addEventListener('resize', syncViewportHeight);
    window.addEventListener('orientationchange', () => { syncViewportHeight(); setTimeout(syncViewportHeight, 260); });

    const svg = (k, s = 22, c = '') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${c}">${IC[k] || ''}</svg>`;

    const SFX = (() => {
      let ac = null;
      const tone = (f, d = .08, t = 'sine', g = .04, dl = 0) => {
        if (!S.sound) return;

    function setHomePage(idx) {
      S.homePage = Math.max(0, Math.min(2, idx));
      const tr = $('homePagesTrack');
      if (tr) tr.style.transform = `translateX(-${S.homePage * 100}%)`;
      paintPageDots();
    }

    function paintPageDots() {
      const box = $('pageDots'); if (!box) return;
      box.innerHTML = [0, 1, 2].map(i => `<button type="button" data-pdot="${i}" aria-label="第${i+1}页" class="page-dot ${S.homePage === i ? 'active' : ''}"></button>`).join('');
    }

    let swipeBound = false;
    function bindHomeSwipe() {
      if (swipeBound) return;
      swipeBound = true;
      const vp = $('homePagesViewport'); if (!vp) return;
      let sx = 0, sy = 0, down = false;
      const start = (x, y) => { sx = x; sy = y; down = true; };
      const end = (x, y) => {
        if (!down) return;
        down = false;
        const dx = x - sx, dy = y - sy;
        if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          SFX.tap();
          setHomePage(S.homePage + (dx < 0 ? 1 : -1));
        }
      };
      vp.addEventListener('touchstart', e => { const t = e.touches[0]; if (t) start(t.clientX, t.clientY); }, { passive: true });
      vp.addEventListener('touchend', e => { const t = e.changedTouches[0]; if (t) end(t.clientX, t.clientY); }, { passive: true });
      vp.addEventListener('mousedown', e => start(e.clientX, e.clientY));
      window.addEventListener('mouseup', e => { if (down) end(e.clientX, e.clientY); });
    }

      setB('wechat', CHATS.reduce((a, c) => a + (c.unread || 0), 0));

      setB('phone', S.missedCalls);
      setB('mail', S.mailUnread);

    async function callDualAI(sysPrompt, userPrompt) {
      const model = getActiveModelName();
      if (S.ai.provider === 'gemini') {
        const key = (S.ai.geminiKey || '').trim();
        if (!key) throw new Error('未填写 Gemini API Key');
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
        const res = await fetch(url, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: sysPrompt }] },
            generationConfig: { responseMimeType: 'application/json', temperature: 0.9 }
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        return JSON.parse(raw.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim());
      } else {
        const key = (S.ai.openaiKey || '').trim();
        const base = (S.ai.openaiUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
        if (!key) throw new Error('未填写 OpenAI 兼容 API Key');
        const res = await fetch(`${base}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
          body: JSON.stringify({
            model, temperature: 0.9,
            messages: [
              { role: 'system', content: sysPrompt + '\n请严格只输出合法的 JSON 对象，不要包含任何多余解释或 Markdown 代码块。' },
              { role: 'user', content: userPrompt }
            ]
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
        const raw = data?.choices?.[0]?.message?.content || '';
        const cleaned = raw.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim();
        const match = cleaned.match(/\{[\s\S]*\}/);
        return JSON.parse(match ? match[0] : cleaned);
      }
    }

    async function fetchModelsForPhone() {
      saveAiForm();
      const btn = $('aiFetchBtn'), msg = $('aiStatusMsg');
      btn.disabled = true; btn.textContent = '正在拉取当前密钥可用模型…';
      try {
        if (S.ai.provider === 'gemini') {
          if (!S.ai.geminiKey) throw new Error('请先粘贴 Gemini API Key');
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(S.ai.geminiKey)}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
          const valid = (data.models || [])
            .filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/i.test(m.name || '') && !/(embedding|imagen|veo|tts)/i.test(m.name || ''))
            .map(m => String(m.name).replace(/^models\//i, ''))
            .sort((a, b) => (b.includes('3.5') - a.includes('3.5')) || (b.includes('flash-lite') - a.includes('flash-lite')));
          if (!valid.length) throw new Error('未检索到可用 Gemini 对话模型');
          S.ai.geminiFetched = valid;
          S.ai.geminiModel = valid[0];
          saveAiCfg(); vAiConfig();
          $('aiStatusMsg').innerHTML = `<span class="text-emerald-300">✓ 拉取成功！共 ${valid.length} 个可用模型，已优先选中 ${esc(valid[0])}。</span>`;
        } else {
          if (!S.ai.openaiKey) throw new Error('请先粘贴 OpenAI 兼容 API Key');
          const base = (S.ai.openaiUrl || 'https://api.openai.com/v1').replace(/\/+$/, '');
          const res = await fetch(`${base}/models`, { headers: { 'Authorization': `Bearer ${S.ai.openaiKey}` } });
          const data = await res.json();
          if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
          const valid = (data.data || []).map(x => x.id).filter(Boolean).slice(0, 60);
          if (!valid.length) throw new Error('接口未返回模型列表，请直接手填模型名');
          S.ai.openaiFetched = valid;
          S.ai.openaiModel = valid[0];
          saveAiCfg(); vAiConfig();
          $('aiStatusMsg').innerHTML = `<span class="text-emerald-300">✓ 拉取成功！共获取 ${valid.length} 个可用模型。</span>`;
        }
        SFX.ok();
      } catch (err) {
        if (msg) msg.innerHTML = `<span class="text-rose-300">✕ 拉取失败：${esc(err.message)}</span>`;
        btn.disabled = false; btn.textContent = '✦ 一键拉取当前密钥真实可用模型';
      }
    }

    window.addEventListener('keydown', e => {
      if (S.unlocked) return;
      if (e.key >= '0' && e.key <= '9') addPin(e.key);
      else if (e.key === 'Backspace') delPin();
    });

    initData();
    initLock();
    renderHome();
    syncClock();
    setInterval(syncClock, 15000);
  </script>
</body>
</html>
